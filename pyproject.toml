[project]
name = "jobhunter"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.135.1",
    "pydantic==2.13.5",
    "sqlalchemy==2.0.54",
    "alembic==1.20.0",
    "uvicorn==0.53.0",
    "urlstd==2023.7.26.1",
    "starlette==0.52.1",
    "icupy==0.22.0",
    "anyio==4.12.1",
]

[dependency-groups]
dev = ["pytest==9.1.1", "httpx==0.28.1", "ruff==0.16.8", "pyright==1.1.414"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/src/jobhunter"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
include = ["backend/src", "backend/alembic", "backend/tests", "scripts"]
typeCheckingMode = "strict"
extraPaths = ["backend/src"]
stubPath = "backend/typings"
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
